[package]
name = "anala-lending"
version = "0.1.0"
description = "AI-powered lending protocol for PreStocks tokens"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "anala_lending"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = "0.32.1"
anchor-spl = "0.32.1"

[dev-dependencies]
solana-program-test = "~2.0"
solana-sdk = "~2.0"
